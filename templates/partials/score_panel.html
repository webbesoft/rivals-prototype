<section class="app-score-panel mb-8 app-panel bg-white border border-gray-200 shadow-sm"
         aria-label="Gameweek score and average"
         hx-get="{% url 'rivals:teams.score' score_team.id %}"
         hx-trigger="load, every 120s"
         hx-swap="innerHTML"
         hx-request='{"timeout":12000}'
         hx-on::after-request="if (!event.detail.successful) this.querySelector('[data-score-status]').textContent = 'Could not refresh scores. Retrying automatically.';">
  {% include "partials/score_summary.html" %}
</section>
