{% for match in week.matches %}
<span class="decision-fdr decision-fdr--{{ match.difficulty|default_if_none:'unknown' }}"><span>{{ match.opponent }} ({{ match.venue }})</span><strong aria-label="FPL difficulty {{ match.difficulty|default_if_none:'unavailable' }}">{{ match.difficulty|default_if_none:'—' }}</strong></span>
{% empty %}<span class="decision-fdr decision-fdr--blank">Blank</span>{% endfor %}
