{% if report.player_outlooks %}
<div style="margin:20px 0;">
  <h3 style="margin:0 0 8px;font-size:16px;">Who to keep an eye on</h3>
  {% for player in report.player_outlooks %}
  <p style="margin:0 0 12px;font-size:13px;line-height:1.7;"><strong>{{ player.name }} · {{ player.label }}.</strong> {{ player.detail }}</p>
  {% endfor %}
</div>
{% endif %}
