<c-layouts.base title="Unsubscribe from briefing emails - RivalSpy">
  <div class="max-w-xl mx-auto px-4 py-10">
    {% if done %}<h1 class="app-page-title mb-4">Briefing emails turned off</h1><p>You can enable them again in your account settings.</p>
    {% else %}<h1 class="app-page-title mb-4">Turn off briefing emails?</h1><p class="mb-4">Your account and saved plans will stay available.</p><form method="POST">{% csrf_token %}<button class="app-primary-button" type="submit">Unsubscribe from briefing emails</button></form>{% endif %}
  </div>
</c-layouts.base>
