<c-layouts.base title="Reset your password - RivalSpy"><div class="app-auth"><section class="app-panel app-auth-card">
<h1 class="app-section-title">Reset your password</h1><p>Enter your email and we’ll send you a link to choose a new password.</p>
<form method="post" class="app-form">{% csrf_token %}{{ form.as_p }}<button class="app-primary-button" type="submit">Send reset link</button></form>
<p class="app-auth-switch"><a href="{% url 'accounts:login' %}">Back to login</a></p>
</section></div></c-layouts.base>
