<c-layouts.base title="Choose a new password - RivalSpy"><div class="app-auth"><section class="app-panel app-auth-card">
<h1 class="app-section-title">Choose a new password</h1>{% if validlink %}<form method="post" class="app-form">{% csrf_token %}{{ form.as_p }}<button class="app-primary-button" type="submit">Save password</button></form>{% else %}<p>This reset link is invalid or has expired.</p><a href="{% url 'accounts:password_reset' %}">Request a new link</a>{% endif %}
<p class="app-auth-switch"><a href="{% url 'accounts:login' %}">Back to login</a></p>
</section></div></c-layouts.base>
