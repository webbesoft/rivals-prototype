<div class="app-panel bg-white border border-gray-200 shadow-sm" data-team-id="{{ team.id }}" data-last-gameweek="{% if team.get_available_gameweeks %}{{ team.get_available_gameweeks|last }}{% endif %}">
  <!-- Header Bar with Navigation Controls -->
  <div class="px-5 py-3 border-b border-gray-200 bg-gray-50/75 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
    <div>
      <div class="flex items-center gap-2">
        <h3 class="text-xs font-black uppercase tracking-wider text-pitch tabular-nums">Lineup & squad history</h3>
        <span class="text-gray-300 tabular-nums">/</span>
        <span class="text-xs tabular-nums text-gray-500">The team sheet</span>
      </div>
      <p class="text-[11px] tabular-nums text-gray-500 mt-0.5">Formations, active multipliers, individual returns, and bench order</p>
    </div>

    <!-- Gameweek Switcher -->
    <div class="inline-flex items-center border border-gray-300 bg-white tabular-nums text-xs shadow-sm self-start sm:self-auto">
      <button
        id="prev-gw-btn"
        onclick="changeGameweek(-1)"
        class="px-3 py-1.5 hover:bg-gray-100 text-text-main border-r border-gray-300 disabled:opacity-25 disabled:cursor-not-allowed font-bold transition-colors cursor-pointer"
        title="Previous Gameweek"
      >
        ‹ Prev
      </button>

      <span class="px-4 py-1.5 font-bold text-text-main tracking-wide">
        GW <span id="current-gw-display">—</span>
      </span>

      <button
        id="next-gw-btn"
        onclick="changeGameweek(1)"
        class="px-3 py-1.5 hover:bg-gray-100 text-text-main border-l border-gray-300 disabled:opacity-25 disabled:cursor-not-allowed font-bold transition-colors cursor-pointer"
        title="Next Gameweek"
      >
        Next ›
      </button>
    </div>
  </div>

  <!-- Squad Display Container -->
  <div class="p-5 sm:p-6">
    <div id="squad-container" class="min-h-[280px]">
      <div class="flex flex-col items-center justify-center h-48 text-center tabular-nums">
        <div class="w-6 h-6 border-2 border-pitch border-t-transparent rounded-full animate-spin mb-3"></div>
        <p class="text-gray-500 text-xs uppercase tracking-wider">Loading squad setup...</p>
      </div>
    </div>
  </div>
</div>

<script>
  let currentGameweek = null;
  let availableGameweeks = [
    {% for gw in available_gameweeks %}{{ gw }}{% if not forloop.last %}, {% endif %}{% endfor %}
  ];

  function changeGameweek(direction) {
    if (!currentGameweek && availableGameweeks.length > 0) {
      currentGameweek = availableGameweeks[availableGameweeks.length - 1];
    }

    const currentIndex = availableGameweeks.indexOf(currentGameweek);
    const newIndex = currentIndex + direction;

    if (newIndex >= 0 && newIndex < availableGameweeks.length) {
      showSquad(availableGameweeks[newIndex]);
    }
  }

  function updateControls() {
    const display = document.getElementById("current-gw-display");
    const prevBtn = document.getElementById("prev-gw-btn");
    const nextBtn = document.getElementById("next-gw-btn");

    if (display) display.textContent = currentGameweek || "—";

    const currentIndex = availableGameweeks.indexOf(currentGameweek);
    if (prevBtn) prevBtn.disabled = currentIndex <= 0;
    if (nextBtn) nextBtn.disabled = currentIndex >= availableGameweeks.length - 1;
  }

  function showSquad(gameweek) {
    currentGameweek = gameweek;
    updateControls();

    const container = document.getElementById("squad-container");
    if (!container) return;

    container.innerHTML = `
      <div class="flex flex-col items-center justify-center h-48 text-center tabular-nums">
        <div class="w-6 h-6 border-2 border-pitch border-t-transparent rounded-full animate-spin mb-3"></div>
        <p class="text-gray-500 text-xs uppercase tracking-wider">Accessing Gameweek ${gameweek} Lineup...</p>
      </div>
    `;

    const teamElem = document.querySelector("[data-team-id]");
    if (!teamElem) return;
    const teamId = teamElem.getAttribute("data-team-id");

    fetch(`/dashboard/teams/${teamId}/squad-history/${gameweek}/`)
      .then((response) => {
        if (!response.ok) throw new Error("Network response was not ok");
        return response.json();
      })
      .then((data) => {
        displaySquad(data, gameweek);
      })
      .catch((error) => {
        console.error("Error loading squad history:", error);
        container.innerHTML = `
          <div class="p-8 text-center tabular-nums">
            <p class="text-danger text-xs font-bold uppercase tracking-wide">Squad record unavailable</p>
            <p class="text-gray-500 text-xs mt-1">Could not load tactical data for Gameweek ${gameweek}.</p>
          </div>
        `;
      });
  }

  function displaySquad(squadData, gameweek) {
    const startingXI = squadData.filter((player) => player.position <= 11);
    const bench = squadData.filter((player) => player.position > 11);

    const gkps = startingXI.filter((p) => p.position_type === "GKP");
    const defs = startingXI.filter((p) => p.position_type === "DEF");
    const mids = startingXI.filter((p) => p.position_type === "MID");
    const fwds = startingXI.filter((p) => p.position_type === "FWD");

    const formationStr = `${defs.length}-${mids.length}-${fwds.length}`;
    const totalStartingPts = startingXI.reduce(
      (sum, p) => sum + (p.total_points_at_time || 0) * (p.multiplier || 1),
      0
    );

    const html = `
      <div class="space-y-6">
        <!-- Starting XI Section Header -->
        <div class="pb-3 border-b border-gray-200 flex flex-wrap items-center justify-between gap-2">
          <div class="flex items-center gap-2">
            <span class="text-xs tabular-nums font-black uppercase tracking-wider text-text-main">
              Starting XI
            </span>
            <span class="text-xs tabular-nums text-pitch font-bold bg-pitch/10 px-2 py-0.5 border border-pitch/30 rounded-sm">
              Formation ${formationStr}
            </span>
          </div>
          <div class="text-xs tabular-nums text-gray-600">
            XI Total Points: <span class="font-bold text-text-main">${totalStartingPts} pts</span>
          </div>
        </div>

        <!-- Position Lines -->
        <div class="space-y-5">
          <!-- Goalkeeper Line -->
          <div>
            <div class="flex items-center gap-2 mb-2">
              <span class="text-[11px] tabular-nums font-bold uppercase tracking-wider text-amber-800">
                Goalkeeper
              </span>
              <span class="h-px bg-amber-200 flex-1"></span>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
              ${gkps.map((player) => createPlayerCard(player, false)).join("")}
            </div>
          </div>

          <!-- Defenders Line -->
          <div>
            <div class="flex items-center gap-2 mb-2">
              <span class="text-[11px] tabular-nums font-bold uppercase tracking-wider text-blue-800">
                Defenders (${defs.length})
              </span>
              <span class="h-px bg-blue-200 flex-1"></span>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-5 gap-3">
              ${defs.map((player) => createPlayerCard(player, false)).join("")}
            </div>
          </div>

          <!-- Midfielders Line -->
          <div>
            <div class="flex items-center gap-2 mb-2">
              <span class="text-[11px] tabular-nums font-bold uppercase tracking-wider text-emerald-800">
                Midfielders (${mids.length})
              </span>
              <span class="h-px bg-emerald-200 flex-1"></span>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-5 gap-3">
              ${mids.map((player) => createPlayerCard(player, false)).join("")}
            </div>
          </div>

          <!-- Forwards Line -->
          <div>
            <div class="flex items-center gap-2 mb-2">
              <span class="text-[11px] tabular-nums font-bold uppercase tracking-wider text-rose-800">
                Forwards (${fwds.length})
              </span>
              <span class="h-px bg-rose-200 flex-1"></span>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
              ${fwds.map((player) => createPlayerCard(player, false)).join("")}
            </div>
          </div>
        </div>

        <!-- Bench Section -->
        <div class="pt-4 border-t border-gray-200">
          <div class="flex items-center justify-between mb-3">
            <div class="flex items-center gap-2">
              <span class="text-xs tabular-nums font-bold uppercase tracking-wider text-gray-500">
                Bench Substitutes
              </span>
              <span class="text-[10px] tabular-nums text-gray-400">Order by priority</span>
            </div>
            <span class="text-[11px] tabular-nums text-gray-400">4 Reserves</span>
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
            ${bench.map((player) => createPlayerCard(player, true)).join("")}
          </div>
        </div>
      </div>
    `;

    const container = document.getElementById("squad-container");
    if (container) container.innerHTML = html;
  }

  function createPlayerCard(player, isBench = false) {
    const captainBadge = player.is_captain
      ? `<span class="inline-flex items-center justify-center px-1.5 py-0.5 bg-pitch text-white text-[10px] tabular-nums font-black border border-pitch rounded-sm tracking-wide" title="Captain">C${player.multiplier > 1 ? ` ×${player.multiplier}` : ''}</span>`
      : "";
    const viceCaptainBadge = player.is_vice_captain
      ? `<span class="inline-flex items-center justify-center px-1.5 py-0.5 bg-gray-700 text-white text-[10px] tabular-nums font-black border border-gray-800 rounded-sm tracking-wide" title="Vice Captain">V</span>`
      : "";

    const positionStyles = {
      GKP: {
        border: "border-l-4 border-l-amber-500",
        badge: "bg-amber-100 text-amber-900 border-amber-300",
      },
      DEF: {
        border: "border-l-4 border-l-blue-600",
        badge: "bg-blue-100 text-blue-900 border-blue-300",
      },
      MID: {
        border: "border-l-4 border-l-emerald-600",
        badge: "bg-emerald-100 text-emerald-900 border-emerald-300",
      },
      FWD: {
        border: "border-l-4 border-l-rose-600",
        badge: "bg-rose-100 text-rose-900 border-rose-300",
      },
    };

    const style = positionStyles[player.position_type] || {
      border: "border-l-4 border-l-gray-400",
      badge: "bg-gray-100 text-gray-800 border-gray-300",
    };

    const cardBg = isBench
      ? "bg-gray-50/80 border-gray-200"
      : "bg-white border-gray-200 hover:border-pitch";

    const benchTag = isBench
      ? `<span class="text-[10px] tabular-nums text-gray-500 bg-gray-200/70 px-1 py-0.5 border border-gray-300 rounded-sm">${player.position === 12 ? 'GK Sub' : `Sub ${player.position - 12}`}</span>`
      : "";

    // Parse xG / xA
    const xgNum = player.expected_goals ? parseFloat(player.expected_goals) : 0;
    const xaNum = player.expected_assists ? parseFloat(player.expected_assists) : 0;
    const hasMetrics = xgNum > 0 || xaNum > 0;

    // Points display with multiplier consideration
    const rawPts = player.total_points_at_time !== null && player.total_points_at_time !== undefined
      ? player.total_points_at_time
      : null;
    const effectivePts = rawPts !== null && player.multiplier ? rawPts * player.multiplier : rawPts;

    let ptsColor = "text-text-main";
    if (effectivePts !== null) {
      if (effectivePts >= 10) ptsColor = "text-pitch font-black";
      else if (effectivePts <= 2) ptsColor = "text-gray-500";
    }

    return `
      <div class="app-player-card p-3 border shadow-xs transition-colors ${cardBg} ${style.border}">
        <!-- Top Row: Position Badge, Captain/Vice Badge & Points -->
        <div class="flex items-center justify-between gap-2 mb-2">
          <!-- Position & Role Group with clean gap -->
          <div class="flex items-center gap-2">
            <span class="text-[10px] tabular-nums font-bold px-1.5 py-0.5 border ${style.badge} rounded-sm">
              ${player.position_type}
            </span>
            ${captainBadge}
            ${viceCaptainBadge}
            ${benchTag}
          </div>

          <!-- Points Display -->
          <div class="text-right shrink-0">
            <span class="tabular-nums font-bold text-sm tabular-nums ${ptsColor}">
              ${effectivePts !== null ? effectivePts : '—'}
            </span>
            <span class="text-[10px] tabular-nums text-gray-400 font-normal ml-0.5">pts</span>
          </div>
        </div>

        <!-- Middle Row: Player Name & Cost/Form -->
        <div class="min-w-0 mb-2">
          <p class="font-bold text-xs text-text-main truncate uppercase tracking-tight">
            ${player.player_name}
          </p>
          <div class="flex items-center gap-2 text-[11px] tabular-nums text-gray-500 mt-0.5">
            <span class="font-semibold text-gray-700">${player.formatted_cost}</span>
            ${player.form ? `<span class="text-gray-300">·</span><span>Form ${player.form}</span>` : ""}
          </div>
        </div>

        <!-- Bottom Row: xG & xA with distinct spacing -->
        ${hasMetrics ? `
          <div class="flex items-center gap-2 text-[10px] tabular-nums text-gray-600 border-t border-gray-100 pt-2 mt-1">
            ${xgNum > 0
              ? `<span class="px-1.5 py-0.5 bg-gray-50 border border-gray-200 rounded-sm">xG ${xgNum.toFixed(2)}</span>`
              : ""
            }
            ${xaNum > 0
              ? `<span class="px-1.5 py-0.5 bg-gray-50 border border-gray-200 rounded-sm">xA ${xaNum.toFixed(2)}</span>`
              : ""
            }
          </div>
        ` : ""}
      </div>
    `;
  }

  document.addEventListener("DOMContentLoaded", function () {
    const lastGameweek = document
      .querySelector("[data-last-gameweek]")
      ?.getAttribute("data-last-gameweek");
    if (lastGameweek) {
      showSquad(parseInt(lastGameweek));
    }
  });
</script>
