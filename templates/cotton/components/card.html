<div class="border-b border-gray-100 py-4">
  {% if title %}
  <h2 class="text-sm font-bold text-text-main mb-2">{{ title }}</h2>
  {% endif %}
  <div class="text-text-main">
    {{ slot }}
  </div>
  {% if url %}
  <div class="mt-3">
    <a href="{{ url }}" class="text-xs font-bold text-accent hover:underline">View →</a>
  </div>
  {% endif %}
</div>
